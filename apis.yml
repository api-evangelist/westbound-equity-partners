name: Westbound Equity Partners
description: 'Westbound Equity Partners is a venture capital firm that invests financial and social
  capital into values-aligned founding teams, aiming to build a virtuous cycle of wealth and opportunity.
  The firm backs ventures across workplace equity and wealth-building, climate tech and decarbonization,
  AI and advanced technology, and social impact, and supports founders through the Westbound Network of
  entrepreneurs, operators, and investors plus culture coaching and talent services. Portfolio companies
  include Esusu, Planet FWD, Syndio, Sierra, Mon Ami, The Browser Company, Conduit Tech, Manas AI, and
  Laborup. Surfaced as a portfolio company of foundry-group. Westbound publishes a marketing and careers
  website but no public developer or API program.'
